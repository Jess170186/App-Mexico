name: Répertoire mensuel (OpenStreetMap, gratuit)

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Extraire depuis OpenStreetMap
        run: python osm_extract.py
      - name: Publier repertoire.xlsx + places.json
        run: |
          git config user.name  "app-mexico-bot"
          git config user.email "bot@appmexico.local"
          git add repertoire.xlsx places.json
          git commit -m "chore: répertoire mensuel (OSM)" || echo "Aucun changement"
          git push
